name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: ESLint + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Export OpenAPI spec
        run: npm run openapi --silent > openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

  deploy:
    name: Deploy to Render
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      # Render auto-deploys from the connected branch (render.yaml autoDeploy: true).
      # Optionally add a RENDER_DEPLOY_HOOK_URL repository secret to trigger the deploy
      # explicitly only after CI is green.
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - relying on Render auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy triggered."
